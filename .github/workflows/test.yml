name: test

# Every branch, not just main: the integration branch is what proves plugin-validate.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No eval runs here and no step sees a model key; evals run locally under /cad-verify.
jobs:
  node-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # Zero-dep repo, so no install step.
      - run: node --test tests/*.test.mjs

  coverage:
    # Node 26 because --test-coverage-include-all needs 26.7; the two guards catch empty scope and unloaded files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Run the suite with coverage
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include-all
          --test-coverage-include='lib/**'
          --test-coverage-exclude='tests/**'
          --test-coverage-lines=85 --test-coverage-branches=85
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
          tests/*.test.mjs

      - name: Guard against an empty coverage scope
        run: |
          grep -q '^LF:[1-9]' lcov.info

      - name: Guard against a file the suite never loaded
        run: |
          ! grep -qx 'LH:0' lcov.info

  plugin-validate:
    # Strict-validate both manifests, install from this repo's own marketplace, then run the installed check
    # on the installed samples from outside the checkout. /seldon itself needs a model, which CI never has.
    # The CLI pin is the version these commands were tried on and moves by hand.
    # --ignore-scripts stops every install script; the only one links the native binary, so it runs by name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install -g --ignore-scripts @anthropic-ai/claude-code@2.1.326 # zizmor: ignore[adhoc-packages]
      - run: npm explore -g @anthropic-ai/claude-code -- node install.cjs
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict .claude-plugin/plugin.json
      - run: claude plugin marketplace add ./
      - run: claude plugin install seldon@seldon
      - name: Run the installed check from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          INSTALL="$(claude plugin list --json | node -e "const rows = JSON.parse(require('fs').readFileSync(0, 'utf8')); const row = rows.find((r) => r.id === 'seldon@seldon'); if (!row) { console.error('seldon@seldon is not installed'); process.exit(1); } process.stdout.write(row.installPath);")"
          test -f "$INSTALL/skills/seldon/SKILL.md"
          node "$INSTALL/lib/check.mjs" "$INSTALL/samples"
