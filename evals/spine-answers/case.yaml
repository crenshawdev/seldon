schema_version: "1.1"
name: spine-answers
description: Resumes a /seldon session whose last turn reached the Sowlist spine step and asked the fixed unattended-work and failure questions about the morning list, with the confirmed brief and PRD in .planning/seldon/ and no spine. The user's answers have to land in a .planning/seldon/spine.md that passes the spine check, quoted word for word on > lines inside the morning list's own decision, never in a decision that holds only the answers.
runs: 1
context:
  history_file: history.jsonl
  scaffold_script: seed.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep]
