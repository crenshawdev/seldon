schema_version: "1.1"
name: stale-epics
description: Resumes a /seldon session where a bare /seldon found the Toolshed spine stale after reminders were dropped, retired S-03, and was confirmed with the /clear words. The brief and PRD at .planning/seldon/ are copied from samples/spine-rerun/ and the spine from samples/epics-rerun/, next to samples/epics.md, which was built from the spine before the change, so the epics are stale. A bare /seldon has to say the epics stale line before it edits epics.md, stamp epics.md with the current spine's hash, repeat the epics check's pass line, and Read nothing outside .planning/seldon/.
runs: 1
context:
  history_file: history.jsonl
  scaffold_script: seed.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep]
