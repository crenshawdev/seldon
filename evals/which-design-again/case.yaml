schema_version: "1.1"
name: which-design-again
description: Resumes a /seldon session that ended on the which-design question, which named both designs by their briefs' titles, Toolshed with its four finished documents at the top of .planning/seldon/ and Sowlist with a brief in .planning/seldon/sowlist/. The reply is seldon, which matches every design's folder since each sits in .planning/seldon/, so Seldon has to write and edit nothing, name both designs by title, Toolshed and Sowlist, and end on the which-design question again.
