schema_version: "1.1"
name: fast-path-brief
description: Resumes a /seldon session at its fast-path recommendation, so the confirmation has to write a brief that passes the brief-only check.
runs: 1
context:
  history_file: history.jsonl
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep]
