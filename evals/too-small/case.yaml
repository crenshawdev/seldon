schema_version: "1.1"
name: too-small
description: A /seldon in a fresh session whose dump asks for one setting that turns an existing backup tool's progress bar on or off, so Seldon has to say on one line that it looks too small to need Seldon and that Cadence can take it directly, still give the Recommended path line, and write and edit nothing.
runs: 1
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep]
