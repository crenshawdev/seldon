schema_version: "1.1"
name: epics-from-spine
description: A /seldon epics in a fresh session where a confirmed brief, its PRD and its spine are already at .planning/seldon/, copied from samples/brief.md, samples/prd.md and samples/spine.md, and no epics. Seldon has to write a .planning/seldon/epics.md that passes the epics check, give every epic the six fields and the integrated done-when item, cite only the spine's S-01 to S-06 with each one cited and S-02, S-04 and S-05 on every epic, and put each of the PRD's seven requirement IDs on exactly one epic.
runs: 1
context:
  scaffold_script: seed.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep]
