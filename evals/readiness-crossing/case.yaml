schema_version: "1.1"
name: readiness-crossing
description: A bare /seldon in a fresh session where all four documents are at .planning/seldon/, seeded from samples/brief.md and samples/readiness/prd.md, spine.md and epics.md, and none is stale. Every requirement is on an epic, and one epic, E-02, spans Loans and Repairs with no spine boundary between them, so Seldon has to report that one crossing and nothing else, write and edit nothing, and end on the readiness question.
