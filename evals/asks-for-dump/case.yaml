schema_version: "1.1"
name: asks-for-dump
description: Resumes a /seldon session that asked for the dump, so the dump's turn has to recommend a path and write nothing.
runs: 1
context:
  history_file: history.jsonl
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep]
