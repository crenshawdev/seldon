schema_version: "1.1"
name: readiness-hand-off
description: Resumes a /seldon session whose last turn ran the readiness check over the design at .planning/seldon/, seeded from samples/brief.md and samples/readiness/prd.md, spine.md and epics.md, reported its one finding, E-02 crossing Loans and Repairs with no spine boundary between them, and ended on the readiness question. The user hands the design off as it is, so Seldon has to write and edit nothing and end on the new-project handoff command.
runs: 1
context:
  history_file: history.jsonl
  scaffold_script: seed.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep]
