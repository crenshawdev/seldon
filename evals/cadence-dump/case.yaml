schema_version: "1.1"
name: cadence-dump
description: A /seldon dump for Toolshed's repair log on a project already under Cadence, seeded with Toolshed's PROJECT.md, ROADMAP.md and STATE.md and no .planning/seldon/, so Seldon has to recommend the fast path on a line of its own instead of refusing, with no Write and no Edit.
runs: 1
context:
  scaffold_script: seed.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep]
