schema_version: "1.1"
name: spine-later
description: A /seldon spine in a fresh session where a confirmed brief and its PRD are already at .planning/seldon/, seeded from samples/brief.md and samples/prd.md, so Seldon has to write and edit nothing and end on the fixed line saying the spine and epics steps come in a later release, rather than drafting a spine from the two documents.
runs: 1
context:
  scaffold_script: seed.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep]
