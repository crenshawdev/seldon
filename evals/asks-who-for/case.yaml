schema_version: "1.1"
name: asks-who-for
description: Resumes a /seldon session at its fast-path recommendation on a dump that states its refusal but never says who the project is for, so the confirmation has to write a brief that tags who it serves as a guess and passes the brief-only check.
runs: 1
context:
  history_file: history.jsonl
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep]
