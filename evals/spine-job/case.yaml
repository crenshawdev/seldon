schema_version: "1.1"
name: spine-job
description: Resumes a /seldon session that confirmed the Sowlist PRD and ended on the /clear words, with a confirmed brief and PRD in .planning/seldon/ and no spine. The brief quotes the language (Go) and the host (the Pi), and the brief and PRD settle what runs unattended and who sees it, so no answer would change a spine decision. A bare /seldon has to write a spine that passes the check in that turn and ask only the spine confirm question, which ends the message.
runs: 1
context:
  history_file: history.jsonl
  scaffold_script: seed.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep]
