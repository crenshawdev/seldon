schema_version: "1.1"
name: cadence-project
description: Resumes a /seldon session at its fast-path recommendation on a project already under Cadence, seeded with Toolshed's PROJECT.md, ROADMAP.md and STATE.md and no .planning/seldon/, so the confirmation has to write a passing brief with no Edit and no Write outside .planning/seldon/.
runs: 1
context:
  history_file: history.jsonl
  scaffold_script: seed.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep]
