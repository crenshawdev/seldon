schema_version: "1.1"
name: prd-conflict-decline
description: Resumes a /seldon session whose last turn ran /seldon prd and stopped on the conflict question after naming S-03, which quotes the line LOAN-03 quotes. The brief at .planning/seldon/ is copied from samples/prd-rerun/, which dropped reminders and gained a refusal to send them, next to samples/prd.md and samples/spine.md, which were built before that change. Dropping reminders retires LOAN-03, and spine decision S-03 quotes the same brief line LOAN-03 does. The user declines in plain words, so Seldon has to write and edit nothing and end on the brief decline line, which names /seldon brief.
runs: 1
context:
  history_file: history.jsonl
  scaffold_script: seed.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep]
