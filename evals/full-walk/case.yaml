schema_version: "1.1"
name: full-walk
description: Resumes a /seldon session that took the Toolshed brief, PRD and spine each through its check, its confirm question and the /clear words, with those three files at .planning/seldon/, copied from samples/brief.md, samples/prd.md and samples/spine.md, and no epics. A bare /seldon has to say the epics resume line naming spine.md before reading the PRD or the spine, write a .planning/seldon/epics.md that passes the epics check, repeat its pass line, end on the epics confirm question, and write or edit no other file in .planning/seldon/.
runs: 1
context:
  history_file: history.jsonl
  scaffold_script: seed.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep]
