schema_version: "1.1"
name: readiness-agent
description: A bare /seldon in a fresh session where all four documents are at .planning/seldon/, seeded from samples/brief.md, samples/prd.md, samples/spine.md and samples/epics.md, and none is stale. Seldon has to start exactly one agent, seldon:readiness, hand it the paths of prd.md, spine.md and epics.md and no other path, and Read none of the three itself, while the agent Reads each of the three and nothing else.
runs: 1
context:
  scaffold_script: seed.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep]
