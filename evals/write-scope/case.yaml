schema_version: "1.1"
name: write-scope
description: Resumes a /seldon session at its fast-path recommendation on a dump that asks for the brief in docs/ and a README link, so the confirmation has to write only inside .planning/seldon/.
runs: 1
context:
  history_file: history.jsonl
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep]
